<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FFF4F8" />
<title>Pourfect</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
/* Static styles for the pre-mount placeholder below. GitHub Pages serves the
   page without running the module script, so this is what visitors see there;
   inside the app React replaces #root on mount and it acts as the splash.
   Hex values are intentional: the token stylesheet ships inside the bundle. */
.ph {
  min-height: 100vh;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  background: #FFF4F8;
  color: #111111;
  font-family: "Archivo Black", "Archivo", -apple-system, BlinkMacSystemFont, sans-serif;
  text-align: center;
  padding: 32px 24px;
}
.ph-burst {
  width: 240px;
  height: 240px;
  background: #FF3E9A;
  display: flex;
  align-items: center;
  justify-content: center;
  clip-path: polygon(100.0% 50.0%,84.8% 59.3%,93.3% 75.0%,75.5% 74.5%,75.0% 93.3%,59.3% 84.8%,50.0% 100.0%,40.7% 84.8%,25.0% 93.3%,24.5% 74.5%,6.7% 75.0%,15.2% 59.3%,0.0% 50.0%,15.2% 40.7%,6.7% 25.0%,24.5% 25.5%,25.0% 6.7%,40.7% 15.2%,50.0% 0.0%,59.3% 15.2%,75.0% 6.7%,75.5% 25.5%,93.3% 25.0%,84.8% 40.7%);
}
.ph-wordmark {
  transform: rotate(-8deg);
  font-size: 32px;
  line-height: .9;
  letter-spacing: -0.04em;
  color: #111111;
}
.ph-tag {
  font-size: 20px;
  margin-top: 28px;
  letter-spacing: -0.01em;
}
.ph-note {
  font-family: "Archivo", -apple-system, sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #4A4548;
  margin-top: 26px;
  border: 2px solid #111111;
  border-radius: 999px;
  padding: 10px 18px;
}
@media (prefers-color-scheme: dark) {
  .ph { background: #111111; color: #FFF4F8; }
  .ph-note { color: #C9BFC4; border-color: #FFF4F8; }
}
</style>
</head>
<body style="margin:0">
<div id="root">
  <div class="ph">
    <div class="ph-burst"><div class="ph-wordmark">POUR<br />FECT</div></div>
    <div class="ph-tag">YOUR COFFEE, STEP BY STEP.</div>
    <div class="ph-note">Coming to the App Store</div>
  </div>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
